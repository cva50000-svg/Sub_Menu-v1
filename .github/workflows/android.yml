name: Build Android APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Stiahnutie kodu
      uses: actions/checkout@v4

    - name: Nastavenie Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Kompilacia cez Gradle
      working-directory: SubmenuAndroid
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Ulozenie APK ako artefaktu
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: SubmenuAndroid/app/build/outputs/apk/debug/app-debug.apk
