# Nastavenie JVM argumentov pre Gradle daemon:
# -Xmx2048m obmedzuje maximalnu velkost heap pamate na 2 GB (pri velkych projektoch moze byt nutne zvysit).
# -Dfile.encoding=UTF-8 vynucuje kodovanie UTF-8 pre zdrojaky a vystup.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Pouziva kniznice AndroidX namiesto povodnych Android Support Libraries (standard pre moderne Android projekty).
android.useAndroidX=true

# Generuje triedu R pre kazdy modul iba s jeho vlastnymi zdrojmi (neobsahuje prenesene zdroje zo zavislosti).
# Zrychluje kompilaciu a zlepsuje modularitu; od novsich verzii AGP je predvolene zapnute.
android.nonTransitiveRClass=true
