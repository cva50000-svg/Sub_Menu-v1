# Zakladny adresar, do ktoreho sa ukladaju rozbalene verzie Gradle (GRADLE_USER_HOME je zvycajne ~/.gradle).
distributionBase=GRADLE_USER_HOME
# Podpriecinok v ramci distributionBase, kde sa ulozi rozbalena distribucia Gradle.
distributionPath=wrapper/dists
# Presna URL adresa archivu Gradle, ktory wrapper stiahne a pouzije (tu verzia 8.0).
distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
# Zakladny adresar pre ulozenie stiahnutych .zip balikov pred rozbalenim.
zipStoreBase=GRADLE_USER_HOME
# Podpriecinok v ramci zipStoreBase, kde zostava ulozeny stiahnuty .zip subor.
zipStorePath=wrapper/dists
